name: Check packages

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  checks: write

concurrency:
  group: package-ci
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      targets: ${{ steps.list.outputs.targets }}
    steps:
      - name: List branches needing checks
        id: list
        run: |
          branches=$(curl -s -H "Authorization: Bearer $GITHUB_TOKEN" "https://api.github.com/repos/$GITHUB_REPOSITORY/branches?per_page=100" | jq -r '.[].name')
          targets="[]"
          for b in $branches; do
            if [ "$b" = "main" ]; then
              continue
            fi
            if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "$b" != "${{ github.ref_name }}" ]; then
              continue
            fi
            sha=$(curl -s -H "Authorization: Bearer $GITHUB_TOKEN" "https://api.github.com/repos/$GITHUB_REPOSITORY/branches/$b" | jq -r .commit.sha)
            code=$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $GITHUB_TOKEN" "https://api.github.com/repos/$GITHUB_REPOSITORY/contents/PKGBUILD?ref=$b")
            if [ "$code" != "200" ]; then
              continue
            fi
            runs=$(curl -s -H "Authorization: Bearer $GITHUB_TOKEN" "https://api.github.com/repos/$GITHUB_REPOSITORY/commits/$sha/check-runs" | jq '[.check_runs[] | select(.name == "Package checks")] | length')
            if [ "$runs" != "0" ]; then
              continue
            fi
            targets=$(echo "$targets" | jq --arg b "$b" --arg s "$sha" '. + [{branch: $b, sha: $s}]')
          done
          echo "targets=$targets" >> "$GITHUB_OUTPUT"

  check:
    needs: discover
    if: ${{ fromJSON(needs.discover.outputs.targets)[0] != null }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include: ${{ fromJSON(needs.discover.outputs.targets) }}
    container:
      image: docker.io/archlinux:latest
    steps:
      - name: Install dependencies
        run: pacman -Sy --noconfirm --needed git namcap shellcheck reuse

      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ matrix.branch }}

      - name: Run namcap
        run: namcap PKGBUILD

      - name: Run shellcheck
        run: shellcheck --shell=bash --exclude=SC2034,SC2154 PKGBUILD

      - name: Run reuse lint
        run: reuse lint

      - name: Report check result
        if: always() && !cancelled()
        run: |
          conclusion=failure
          summary="Checks failed on branch ${{ matrix.branch }}."
          if [ "${{ job.status }}" = "success" ]; then
            conclusion=success
            summary="All checks passed on branch ${{ matrix.branch }}."
          fi
          curl -s -X POST \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/check-runs" \
            -d "{\"name\":\"Package checks\",\"head_sha\":\"${{ matrix.sha }}\",\"status\":\"completed\",\"conclusion\":\"$conclusion\",\"output\":{\"title\":\"Package checks: $conclusion\",\"summary\":\"$summary\"}}"
