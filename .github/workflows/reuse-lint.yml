name: Check REUSE compliance

on:
  push:
    branches-ignore:
      - main
  workflow_dispatch:
    inputs:
      branch:
        description: Branch to check
        required: true
        type: string

permissions:
  contents: read

jobs:
  reuse-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.branch || github.ref_name }}

      - name: Skip branches without PKGBUILD
        if: hashFiles('PKGBUILD') == ''
        run: echo "No PKGBUILD in this branch; skipping."

      - name: Install reuse
        if: hashFiles('PKGBUILD') != ''
        run: sudo apt-get update && sudo apt-get install -y reuse

      - name: Run reuse lint
        if: hashFiles('PKGBUILD') != ''
        run: reuse lint
