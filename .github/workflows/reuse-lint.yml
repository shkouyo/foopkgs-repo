name: Check REUSE compliance

on:
  push:
    branches-ignore:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reuse-lint:
    runs-on: ubuntu-latest
    container:
      image: docker.io/archlinux:latest
    steps:
      - name: Install dependencies
        run: pacman -Sy --noconfirm --needed git reuse

      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
      - name: Skip branches without PKGBUILD
        if: hashFiles('PKGBUILD') == ''
        run: echo "No PKGBUILD in this branch; skipping."

      - name: Run reuse lint
        if: hashFiles('PKGBUILD') != ''
        run: reuse lint
