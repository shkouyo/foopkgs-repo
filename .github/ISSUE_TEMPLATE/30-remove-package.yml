name: "Remove package"
description: "Request removal of an existing package"
title: "[remove] package-name"
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Please fill in the form below.
  - type: checkboxes
    id: precheck
    attributes:
      label: "Pre-submission checklist"
      description: "Please confirm the following before submitting"
      options:
        - label: "The package is currently provided by this repository"
          required: true
        - label: "I read carefully and don't check this one"
          required: false
        - label: "The issue has not already been reported or there is no duplicate"
          required: true
  - type: input
    id: package_name
    attributes:
      label: "Package name"
      description: "Name of the package to remove"
    validations:
      required: true
  - type: textarea
    id: reason
    attributes:
      label: "Reason"
      description: "Why should this package be removed?"
    validations:
      required: true
